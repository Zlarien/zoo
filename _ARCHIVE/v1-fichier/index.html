<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Zoo</title>
<style>
  :root{
    --nuit:#06050E; --encre:#0D0B1C; --ardoise:#171130; --trait:#2E2557;
    --trait-fort:#443A7A; --violet:#8438DC; --magenta:#D63C84;
    --lavande:#B092F0; --texte:#F4F1FB; --doux:#C9C2DE; --faible:#8A82A6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--nuit);color:var(--texte);
    font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;overflow:hidden;
  }
  #scene{display:block;width:100%;height:100%;cursor:default}
  #scene.survol{cursor:pointer}

  .titre{position:fixed;top:22px;left:26px;pointer-events:none;z-index:2}
  .titre b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
  .titre span{
    display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faible);margin-top:4px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
  }
  .terrains{
    position:fixed;top:22px;right:26px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;max-width:min(60vw,520px);
  }
  .terrains button{
    background:rgba(13,11,28,.7);border:1px solid var(--trait);color:var(--faible);
    font:inherit;font-size:12px;padding:6px 12px;border-radius:99px;cursor:pointer;
    transition:border-color .2s,color .2s;
  }
  .terrains button:hover{color:var(--texte)}
  .terrains button[aria-current="true"]{color:var(--nuit);font-weight:500}
  .indice{
    position:fixed;bottom:22px;left:0;right:0;text-align:center;z-index:2;
    font-size:13px;color:var(--faible);pointer-events:none;transition:opacity .4s;
  }

  #panneau{
    position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);
    background:var(--encre);border-left:1px solid var(--trait);
    display:flex;flex-direction:column;z-index:3;
    transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  }
  #panneau.ouvert{transform:none}
  .entete{padding:22px 24px 16px;border-bottom:1px solid var(--trait)}
  .entete .nom{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .entete .espece{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--faible);margin-top:4px;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
  }
  .fermer{
    position:absolute;top:20px;right:20px;background:none;border:0;
    color:var(--faible);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;
  }
  .fermer:hover{color:var(--texte)}
  #fil{flex:1;overflow-y:auto;padding:20px 24px;display:flex;
    flex-direction:column;gap:14px;scroll-behavior:smooth}
  .bulle{max-width:88%;font-size:14.5px;line-height:1.65;
    padding:12px 15px;border-radius:3px;white-space:pre-wrap}
  .bulle.animal{background:var(--ardoise);border-left:2px solid var(--lavande);
    align-self:flex-start}
  .bulle.visiteur{background:transparent;border:1px solid var(--trait-fort);
    align-self:flex-end;color:var(--doux)}
  .saisie{padding:16px 24px 20px;border-top:1px solid var(--trait);display:flex;gap:10px}
  .saisie input{
    flex:1;background:var(--nuit);border:1px solid var(--trait-fort);
    color:var(--texte);padding:11px 13px;font:inherit;font-size:14px;border-radius:3px;
  }
  .saisie input:focus{outline:none;border-color:var(--lavande)}
  .saisie button{
    background:var(--violet);border:0;color:#fff;padding:0 18px;
    font:inherit;font-size:14px;font-weight:500;border-radius:3px;cursor:pointer;
  }
  .saisie button:hover{background:var(--magenta)}
  .pistes{padding:0 24px 14px;display:flex;flex-wrap:wrap;gap:7px}
  .pistes button{
    background:none;border:1px solid var(--trait);color:var(--faible);
    font:inherit;font-size:12px;padding:5px 10px;border-radius:99px;cursor:pointer;
  }
  .pistes button:hover{border-color:var(--lavande);color:var(--lavande)}

  @media (max-width:640px){
    #panneau{width:100%;top:auto;height:72%;border-left:0;
      border-top:1px solid var(--trait);transform:translateY(100%)}
    #panneau.ouvert{transform:none}
    /* Sous 640px, la barre des terrains passait sur plusieurs lignes et
       recouvrait le titre : ils se partagent une meme ligne a droite/gauche,
       ca ne tient qu'a partir d'une certaine largeur. On passe la barre sous
       le titre plutot qu'a cote. */
    .titre{left:16px}
    .terrains{top:74px;left:16px;right:16px;max-width:none;justify-content:flex-start}
  }

  .gouter{
    display:none;margin:14px 24px 0;padding:10px 14px;
    background:none;border:1px solid var(--trait-fort);color:var(--lavande);
    font:inherit;font-size:13px;font-weight:500;border-radius:3px;cursor:pointer;
    width:calc(100% - 48px);
  }
  .gouter.visible{display:block}
  .gouter:hover{border-color:var(--lavande);background:rgba(176,146,240,.08)}

  #degustation{
    position:fixed;inset:0;z-index:10;display:none;align-items:center;
    justify-content:center;padding:24px;background:rgba(6,5,14,.86);
  }
  #degustation.ouvert{display:flex}
  .deg-carte{
    width:min(520px,100%);max-height:86vh;overflow-y:auto;position:relative;
    background:var(--encre);border:1px solid var(--trait-fort);border-radius:6px;
    padding:28px 26px 22px;
  }
  .deg-passer{
    position:absolute;top:16px;right:16px;background:none;border:1px solid var(--trait);
    color:var(--faible);font:inherit;font-size:11px;padding:5px 10px;
    border-radius:99px;cursor:pointer;
  }
  .deg-passer:hover{color:var(--texte);border-color:var(--trait-fort)}
  .deg-avert{
    font-size:10.5px;letter-spacing:.04em;color:var(--faible);max-width:78%;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    border:1px solid var(--trait);border-radius:3px;padding:8px 10px;margin-bottom:18px;
  }
  .deg-phase{font-size:15px;line-height:1.65;color:var(--doux);min-height:3.3em}
  .deg-ancres{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 20px}
  .deg-ancres span{
    font-size:12px;color:var(--faible);border:1px solid var(--trait);
    border-radius:99px;padding:5px 10px;
  }
  .deg-reactions{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .deg-reaction{
    border-left:2px solid var(--trait-fort);padding:2px 0 2px 12px;
    opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;
  }
  .deg-reaction.visible{opacity:1;transform:none}
  .deg-reaction .qui{font-size:12px;font-weight:600;margin-bottom:2px}
  .deg-reaction .quoi{font-size:11px;color:var(--faible);margin-bottom:5px}
  .deg-reaction .texte{font-size:13.5px;line-height:1.55;color:var(--texte)}
  .deg-pourquoi{
    background:none;border:0;color:var(--faible);font:inherit;font-size:11.5px;
    text-decoration:underline;cursor:pointer;padding:6px 0 0;
  }
  .deg-pourquoi:hover{color:var(--lavande)}
  .deg-explication{font-size:12.5px;color:var(--faible);margin-top:6px;
    line-height:1.5;display:none}
  .deg-explication.visible{display:block}
  .deg-boutons{display:flex;gap:10px;margin-top:22px}
  .deg-boutons button{flex:1;font:inherit;font-size:13px;padding:9px 12px;
    border-radius:3px;cursor:pointer}
  .deg-rejouer{background:none;border:1px solid var(--trait-fort);color:var(--doux)}
  .deg-rejouer:hover{border-color:var(--lavande);color:var(--lavande)}
  .deg-fermer{background:var(--violet);border:0;color:#fff}
  .deg-fermer:hover{background:var(--magenta)}

  .carnet{
    position:fixed;bottom:22px;right:26px;z-index:2;opacity:0;transition:opacity .3s;
    font-size:11px;color:var(--faible);pointer-events:none;
    font-family:"IBM Plex Mono",ui-monospace,monospace;
  }
  .carnet.visible{opacity:1}
</style>
</head>
<body>

<div class="titre">
  <b>Le Zoo</b>
  <span>Approchez-vous. Ils répondent.</span>
</div>

<nav class="terrains" id="terrains" aria-label="Terrains"></nav>
<canvas id="scene"></canvas>
<div class="indice" id="indice">Cliquez sur un animal</div>

<aside id="panneau" aria-live="polite">
  <div class="entete">
    <div class="nom" id="pNom"></div>
    <div class="espece" id="pEspece"></div>
    <button class="fermer" id="pFermer" aria-label="Fermer">&times;</button>
  </div>
  <button class="gouter" id="pGouter" type="button">Goûter</button>
  <div id="fil"></div>
  <div class="pistes" id="pistes"></div>
  <form class="saisie" id="form">
    <input id="question" type="text" placeholder="Posez votre question" autocomplete="off">
    <button type="submit">Demander</button>
  </form>
</aside>

<div id="degustation" aria-hidden="true">
  <div class="deg-carte" role="dialog" aria-label="Dégustation">
    <button class="deg-passer" id="degPasser" type="button">Passer</button>
    <div class="deg-avert" id="degAvert"></div>
    <div class="deg-phase" id="degPhase"></div>
    <div class="deg-ancres" id="degAncres"></div>
    <div class="deg-reactions" id="degReactions"></div>
    <div class="deg-boutons">
      <button class="deg-rejouer" id="degRejouer" type="button">Rejouer</button>
      <button class="deg-fermer" id="degFermer" type="button">Fermer</button>
    </div>
  </div>
</div>
<div class="carnet" id="carnet"></div>

<script src="animaux.js"></script>
<script src="monde-documentaire.js"></script>
<script src="silhouettes.js"></script>
<script src="terrains.js"></script>
<script src="gouteurs.js"></script>
<script src="moteur.js"></script>
<script src="degustation.js"></script>
<script>
const Z = window.ZOO;
const ANIMAUX_ZOO = Z.ANIMAUX;

const cv = document.getElementById("scene");
const ctx = cv.getContext("2d");
const etat = Z.nouvelleVisite();
let survole = null;
let t = 0;
let terrain = Z.TERRAINS[0].id;
let visibles = Z.entitesDe(terrain);

function taille() {
  const d = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * d;
  cv.height = cv.clientHeight * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
window.addEventListener("resize", taille);

/* Position ecran d'un animal, plus son rayon de clic. */
function boite(a) {
  const w = cv.clientWidth, h = cv.clientHeight;
  return { x: a.x * w, y: a.y * h, r: 34 * a.taille };
}

function fond(w, h) {
  Z.dessinerDecor(ctx, terrain, w, h, t);
}



/*
  Chaque animal est une silhouette abstraite : corps, tete, halo, regard.
  Volontairement non figuratif. Le jour ou le 3D arrive, seul ce bloc change,
  le moteur et les textes ne bougent pas.
*/
function dessiner(a, actif) {
  const { x, y, r } = boite(a);
  const respire = Math.sin(t * 0.0016 + a.x * 9) * (r * 0.045);
  const vif = actif || survole === a.id;

  ctx.save();
  ctx.translate(x, y + respire);

  const halo = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 2.5);
  halo.addColorStop(0, a.accent + (vif ? "3A" : "18"));
  halo.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
  ctx.fill();

  // ombre de contact : elle est plus dense et plus serree quand l'animal est
  // pose, c'est elle qui l'empeche de flotter.
  const base = r * (a.id === "poulpe" ? 1.35 : 1.32);
  const og = ctx.createRadialGradient(0, base, 0, 0, base, r * 1.15);
  og.addColorStop(0, "rgba(0,0,0,.55)");
  og.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = og;
  ctx.beginPath();
  ctx.ellipse(0, base, r * 1.15, r * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = a.couleur;
  ctx.strokeStyle = vif ? a.accent : "#443A7A";
  ctx.lineWidth = vif ? 2 : 1.2;
  ctx.lineJoin = "round";
  Z.dessinerSilhouette(ctx, a.id, r, vif, t);

  // le regard, place selon l'espece, avec un clignement propre a chacun
  // une carte ou un fruit dessine au naturel n'a pas d'yeux
  const oeil = Z.POSITION_YEUX[a.id] || Z.POSITION_YEUX_DEFAUT;
  const cl = Math.abs(Math.sin(t * 0.0009 + a.y * 5)) > 0.985 ? 0.12 : 1;
  ctx.fillStyle = oeil.couleur || a.accent;
  for (const cote of oeil.aucun ? [] : oeil.ecart > 0 ? [-1, 1] : [1]) {
    ctx.beginPath();
    ctx.ellipse(
      r * (oeil.x + cote * oeil.ecart),
      r * oeil.y,
      r * oeil.taille,
      r * oeil.taille * cl,
      0, 0, Math.PI * 2
    );
    ctx.fill();
  }

  ctx.restore();

  ctx.fillStyle = vif ? "#F4F1FB" : "#8A82A6";
  ctx.font = "500 13px 'Space Grotesk', system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(a.nom, x, y + r * 1.9);

  if (survole === a.id && !actif) {
    ctx.fillStyle = "#C9C2DE";
    ctx.font = "12px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText(a.accroche, x, y + r * 2.35);
  }
}

function boucle(now) {
  t = now;
  fond(cv.clientWidth, cv.clientHeight);
  for (const a of visibles) dessiner(a, etat.animalActif?.id === a.id);
  requestAnimationFrame(boucle);
}

function animalSous(mx, my) {
  for (const a of visibles) {
    const { x, y, r } = boite(a);
    if (Math.hypot(mx - x, my - y) < r * 1.35) return a;
  }
  return null;
}

cv.addEventListener("mousemove", e => {
  const b = cv.getBoundingClientRect();
  const a = animalSous(e.clientX - b.left, e.clientY - b.top);
  survole = a?.id ?? null;
  cv.classList.toggle("survol", !!a);
});

cv.addEventListener("click", e => {
  const b = cv.getBoundingClientRect();
  const a = animalSous(e.clientX - b.left, e.clientY - b.top);
  if (a) ouvrir(a.id);
});

const panneau = document.getElementById("panneau");
const fil = document.getElementById("fil");
const pistes = document.getElementById("pistes");

const pGouter = document.getElementById("pGouter");

function ouvrir(id) {
  const a = Z.choisirAnimal(etat, id);
  if (!a) return;
  document.getElementById("pNom").textContent = a.nom;
  document.getElementById("pEspece").textContent = a.espece;
  fil.innerHTML = "";
  bulle("animal", a.ouverture);
  proposerPistes();
  pGouter.classList.toggle("visible", !!a.gout);
  panneau.classList.add("ouvert");
  document.getElementById("indice").style.opacity = "0";
  document.getElementById("question").focus();
}

function fermer() {
  panneau.classList.remove("ouvert");
  etat.animalActif = null;
  document.getElementById("indice").style.opacity = "1";
}
document.getElementById("pFermer").addEventListener("click", fermer);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (degEl.classList.contains("ouvert")) degFermer();
  else fermer();
});
pGouter.addEventListener("click", () => {
  if (etat.animalActif) degLancer(etat.animalActif);
});

function bulle(qui, texte) {
  const d = document.createElement("div");
  d.className = "bulle " + qui;
  d.textContent = texte;
  fil.appendChild(d);
  fil.scrollTop = fil.scrollHeight;
}

/* Trois amorces, pour que le visiteur n'ait jamais la page blanche. */
function proposerPistes() {
  pistes.innerHTML = "";
  for (const q of ["Qui es-tu ?", "D'où viens-tu ?", "Tu es bien ici ?"]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.addEventListener("click", () => envoyer(q));
    pistes.appendChild(b);
  }
}

async function envoyer(q) {
  if (!q.trim() || !etat.animalActif) return;
  bulle("visiteur", q);
  const r = await Z.repondre(etat, q);
  bulle("animal", r);
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const champ = document.getElementById("question");
  const q = champ.value;
  champ.value = "";
  await envoyer(q);
});

/* ------------------------------------------------------------- terrains */
const barre = document.getElementById("terrains");
function construireBarre() {
  barre.innerHTML = "";
  for (const T of Z.TERRAINS) {
    const n = Z.entitesDe(T.id).length;
    if (!n) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${T.nom} ${n}`;
    b.addEventListener("click", () => allerA(T.id));
    barre.appendChild(b);
  }
  marquerBarre();
}
function marquerBarre() {
  [...barre.children].forEach(b => {
    const T = Z.TERRAINS.find(x => b.textContent.startsWith(x.nom));
    const actif = T && T.id === terrain;
    b.setAttribute("aria-current", actif ? "true" : "false");
    b.style.background = actif ? T.accent : "rgba(13,11,28,.7)";
    b.style.borderColor = actif ? T.accent : "";
  });
}
function allerA(id) {
  if (id === terrain) return;
  terrain = id;
  visibles = Z.entitesDe(id);
  survole = null;
  fermer();
  marquerBarre();
}

/* --------------------------------------------------------------- tactile */
/* Un doigt n'a pas de survol : on ouvre directement au toucher. */
cv.addEventListener("touchstart", e => {
  const p = e.changedTouches[0];
  const b = cv.getBoundingClientRect();
  const a = animalSous(p.clientX - b.left, p.clientY - b.top);
  if (a) { e.preventDefault(); ouvrir(a.id); }
}, { passive: false });

/* Balayage horizontal pour changer de terrain. */
let departX = null;
cv.addEventListener("touchstart", e => { departX = e.changedTouches[0].clientX; }, { passive: true });
cv.addEventListener("touchend", e => {
  if (departX === null) return;
  const d = e.changedTouches[0].clientX - departX;
  departX = null;
  if (Math.abs(d) < 70) return;
  const dispo = Z.TERRAINS.filter(T => Z.entitesDe(T.id).length);
  const i = dispo.findIndex(T => T.id === terrain);
  allerA(dispo[(i + (d < 0 ? 1 : dispo.length - 1)) % dispo.length].id);
}, { passive: true });

/* ----------------------------------------------------------- degustation */
/*
  Aucun axe chiffre n'est jamais ecrit a l'ecran ici : Z.deguster() ne
  renvoie que du texte (sequence, ancres, reactions). Voir degustation.js.
*/
const degEl = document.getElementById("degustation");
const degAvert = document.getElementById("degAvert");
const degPhase = document.getElementById("degPhase");
const degAncres = document.getElementById("degAncres");
const degReactions = document.getElementById("degReactions");
const carnet = document.getElementById("carnet");
const reduitMouvement = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let degMinuteur = null;
let degFinPhases = null;
let degFruitCourant = null;

function carnetLire() {
  try { return new Set(JSON.parse(localStorage.getItem("zoo.gouts") || "[]")); }
  catch (e) { return new Set(); }
}
function carnetNoter(idFruit) {
  let s;
  try {
    s = carnetLire();
    s.add(idFruit);
    localStorage.setItem("zoo.gouts", JSON.stringify([...s]));
  } catch (e) { s = new Set([idFruit]); }
  const total = (Z.ANIMAUX || []).filter(a => a.gout).length;
  carnet.textContent = `${s.size} fruit${s.size > 1 ? "s" : ""} gouté${s.size > 1 ? "s" : ""} sur ${total}`;
  carnet.classList.add("visible");
}

function degReaction(r, delaiMs) {
  const d = document.createElement("div");
  d.className = "deg-reaction";
  d.style.borderColor = r.couleur;
  const qui = document.createElement("div");
  qui.className = "qui";
  qui.style.color = r.couleur;
  qui.textContent = r.nom;
  const quoi = document.createElement("div");
  quoi.className = "quoi";
  quoi.textContent = r.quoi;
  const texte = document.createElement("div");
  texte.className = "texte";
  texte.textContent = r.texte;
  const pourquoi = document.createElement("button");
  pourquoi.type = "button";
  pourquoi.className = "deg-pourquoi";
  pourquoi.textContent = "pourquoi ?";
  const explication = document.createElement("div");
  explication.className = "deg-explication";
  explication.textContent = r.pourquoi;
  pourquoi.addEventListener("click", () => explication.classList.toggle("visible"));
  d.append(qui, quoi, texte, pourquoi, explication);
  degReactions.appendChild(d);
  const montrer = () => d.classList.add("visible");
  if (reduitMouvement) montrer(); else setTimeout(montrer, delaiMs);
}

function degLancer(fruit) {
  const scene = Z.deguster(fruit);
  if (!scene) return;
  clearTimeout(degMinuteur);
  degFruitCourant = fruit;
  degAvert.textContent = scene.avertissement || "";
  degPhase.textContent = "";
  degAncres.innerHTML = "";
  degReactions.innerHTML = "";
  degEl.classList.add("ouvert");
  degEl.setAttribute("aria-hidden", "false");

  const phases = [scene.sequence.odeur, scene.sequence.attaque, scene.sequence.corps, scene.sequence.finale];

  degFinPhases = function () {
    clearTimeout(degMinuteur);
    degPhase.textContent = phases[phases.length - 1];
    for (const texte of scene.ancres) {
      const s = document.createElement("span");
      s.textContent = texte;
      degAncres.appendChild(s);
    }
    degReactions.innerHTML = "";
    scene.reactions.forEach((r, i) => degReaction(r, i * 350));
    carnetNoter(scene.fruit);
    degFinPhases = null;
  };

  if (reduitMouvement) { degFinPhases(); return; }

  let i = 0;
  const etape = () => {
    if (i >= phases.length) return degFinPhases();
    degPhase.textContent = phases[i];
    i++;
    degMinuteur = setTimeout(etape, 2200);
  };
  etape();
}

function degFermer() {
  clearTimeout(degMinuteur);
  degFinPhases = null;
  degEl.classList.remove("ouvert");
  degEl.setAttribute("aria-hidden", "true");
}

document.getElementById("degPasser").addEventListener("click", () => {
  if (degFinPhases) degFinPhases();
});
document.getElementById("degRejouer").addEventListener("click", () => {
  if (degFruitCourant) degLancer(degFruitCourant);
});
document.getElementById("degFermer").addEventListener("click", degFermer);
degEl.addEventListener("click", e => { if (e.target === degEl) degFermer(); });

construireBarre();
taille();
requestAnimationFrame(boucle);
</script>
</body>
</html>
